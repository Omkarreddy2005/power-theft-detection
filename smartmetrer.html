<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Meter Integration</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #00e6e6;
    }
    .card {
      background-color: #1f1f2e;
      padding: 2rem;
      border-radius: 10px;
      margin: 2rem auto;
      max-width: 900px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
    }
    .status, .usage, .bill, .fine {
      font-size: 1.3rem;
      margin-top: 20px;
    }
    table {
      width: 100%;
      margin-top: 1rem;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #555;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #2e2e3e;
    }
    .pay-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #00e6e6;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Smart Meter Integration</h1>
  <div class="card">
    <p class="status" id="meterStatus">Checking meter status...</p>

    <h3>Household Wise Billing (15 Households)</h3>
    <table>
      <thead>
        <tr>
          <th>Household</th>
          <th>Total Usage (kWh)</th>
          <th>Fine (₹)</th>
          <th>Total Bill (₹)</th>
        </tr>
      </thead>
      <tbody id="billingTable"></tbody>
    </table>

    <button class="pay-btn" onclick="payNow()">Pay All Bills</button>
  </div>

  <script>
    const numHouses = 15;
    const ratePerKwh = 6.5;
    const fineAmount = 100;
    const maxUpdates = 10;
    const usageData = Array.from({ length: numHouses }, () => ({ usage: 0, fine: 0, bill: 0 }));

    setTimeout(() => {
      document.getElementById('meterStatus').innerText = '15 Smart Meters Connected';
    }, 2000);

    let updateCount = 0;
    const interval = setInterval(() => {
      if (updateCount >= maxUpdates) {
        clearInterval(interval);
        return;
      }

      usageData.forEach((house, index) => {
        const usage = +(Math.random() * 1.5 + 0.5).toFixed(2);
        house.usage += usage;

        const theftDetected = Math.random() > 0.93;
        if (theftDetected && house.fine === 0) {
          house.fine = fineAmount;
        }

        house.bill = +(house.usage * ratePerKwh + house.fine).toFixed(2);
      });

      renderTable();
      updateCount++;
    }, 1000);

    function renderTable() {
      const table = usageData.map((house, i) =>
        `<tr>
          <td>House ${i + 1}</td>
          <td>${house.usage.toFixed(2)}</td>
          <td>${house.fine}</td>
          <td>${house.bill.toFixed(2)}</td>
        </tr>`
      ).join('');

      document.getElementById('billingTable').innerHTML = table;
    }

    function payNow() {
      const total = usageData.reduce((sum, h) => sum + h.bill, 0).toFixed(2);
      alert(`Redirecting to payment gateway. Total amount: ₹${total}`);
      window.location.href = 'https://www.example.com/payment';
    }
  </script>
</body>
</html>
